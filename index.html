<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in form</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="image2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,
300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="form-container">
    <form onsubmit="validateForm()">
        <h1>Log in</h1>
      
        <div class="container">
          <label for="username"><b>Username:</b></label>
          <input type="text" id="username" name="username" required>
      
          <label for="password"><b>Password:</b></label>
          <input type="password" id="password" name="password" required>
      
          <input type="submit" value="login">
        </div>
      </form>
      </div>
      <script>
        function validateForm(){
          event.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;


            if(username === "hilton" && password === "12345"){
                window.location.href = "home.html";
                return false;
            }
            else{
                alert("invalid username or password");
                return false;
            }

        }
      </script>
      
</body>
</html>
